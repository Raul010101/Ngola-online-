<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Loja Rápida — Meu Produto</title>
  <style>
    /* ---- Estilos simples e responsivos ---- */
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;margin:0;background:#f6f7fb;color:#111}
    header{background:#fff;padding:16px 20px;box-shadow:0 2px 6px rgba(20,20,40,.06);display:flex;align-items:center;justify-content:space-between}
    h1{font-size:18px;margin:0}
    main{padding:20px;max-width:1100px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .card{background:#fff;padding:14px;border-radius:8px;box-shadow:0 2px 6px rgba(20,20,40,.04);display:flex;flex-direction:column}
    .card img{width:100%;height:160px;object-fit:cover;border-radius:6px}
    .card h3{margin:10px 0 6px;font-size:16px}
    .card p{margin:0 0 10px;color:#555;font-size:14px}
    .card .price{font-weight:700;margin-bottom:10px}
    .btn{background:#0b75ef;color:white;border:0;padding:10px 12px;border-radius:6px;cursor:pointer}
    .cart{position:fixed;right:18px;bottom:18px;background:#fff;padding:12px;border-radius:10px;box-shadow:0 8px 24px rgba(20,20,40,.12);width:320px;max-width:90%}
    .cart h4{margin:0 0 8px}
    .cart-list{max-height:240px;overflow:auto;margin-bottom:8px}
    .cart-item{display:flex;justify-content:space-between;margin-bottom:8px}
    footer{padding:20px;text-align:center;color:#666;font-size:13px}
    @media (max-width:520px){ .card img{height:120px} .cart{width:95%;left:2.5%;right:2.5%} }
  </style>

  <!--
  INSTRUÇÕES RÁPIDAS:
  1) Para usar PayPal: substitui "REPLACE_WITH_PAYPAL_CLIENT_ID" no script abaixo pelo teu PayPal Client ID (Business account).
  2) Para Stripe Checkout: segue docs Stripe para criar sessão no servidor e redirecionar (Stripe Checkout requer um pequeno backend).
  3) Para publicar grátis: podes usar GitHub Pages ou Netlify (Netlify dá deploy automático + CDN).
  -->

  <!-- PayPal SDK (substitui client-id pelo teu ID) -->
  <script src="https://www.paypal.com/sdk/js?client-id=REPLACE_WITH_PAYPAL_CLIENT_ID&currency=USD"></script>
</head>
<body>
  <header>
    <h1>Minha Loja</h1>
    <div>Vendas online • Fácil</div>
  </header>

  <main>
    <section>
      <h2>Produtos</h2>
      <div id="productGrid" class="grid"></div>
    </section>
  </main>

  <!-- Carrinho -->
  <div id="cart" class="cart" aria-live="polite">
    <h4>Carrinho</h4>
    <div id="cartList" class="cart-list"></div>
    <div><strong>Total: </strong><span id="cartTotal">0.00</span> USD</div>
    <div style="margin-top:10px" id="paypalButtonsContainer"></div>
  </div>

  <footer>
    © <span id="year"></span> Minha Loja — Personaliza produtos e textos.
  </footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const products = [
    {id: 'p1', title: 'Bolsa Feminina - Smart', price: 29.90, img: 'https://picsum.photos/seed/bolsa1/600/400'},
    {id: 'p2', title: 'Carteira Compacta', price: 14.50, img: 'https://picsum.photos/seed/carteira2/600/400'},
    {id: 'p3', title: 'Chinelas Confort', price: 9.90, img: 'https://picsum.photos/seed/chinelas3/600/400'}
  ];

  const state = { cart: {} };

  function format(n){ return Number(n).toFixed(2); }

  function renderProducts(){
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    products.forEach(p=>{
      const div = document.createElement('div'); div.className = 'card';
      div.innerHTML = `
        <img src="${p.img}" alt="${p.title}">
        <h3>${p.title}</h3>
        <p class="price">${format(p.price)} USD</p>
        <p>${p.title} — descrição curta. Personaliza aqui o texto do produto.</p>
        <button class="btn" data-id="${p.id}">Adicionar ao carrinho</button>
      `;
      grid.appendChild(div);
    });
  }

  function renderCart(){
    const list = document.getElementById('cartList');
    list.innerHTML = '';
    let total = 0;
    Object.values(state.cart).forEach(item=>{
      total += item.qty * item.price;
      const div = document.createElement('div'); div.className = 'cart-item';
      div.innerHTML = `<div>${item.title} x ${item.qty}</div><div>${format(item.qty*item.price)}</div>`;
      list.appendChild(div);
    });
    document.getElementById('cartTotal').textContent = format(total);
    renderPayPalButtons();
  }

  document.addEventListener('click', function(e){
    if(e.target.matches('[data-id]')){
      const id = e.target.getAttribute('data-id');
      const p = products.find(x=>x.id===id);
      if(!state.cart[id]) state.cart[id] = {...p, qty:0};
      state.cart[id].qty++;
      renderCart();
    }
  });

  function renderPayPalButtons(){
    const container = document.getElementById('paypalButtonsContainer');
    container.innerHTML = '';
    if(Object.keys(state.cart).length === 0) return;
    const el = document.createElement('div'); el.id = 'paypal-button';
    container.appendChild(el);
    const total = Number(Object.values(state.cart).reduce((s,i)=>s + i.qty * i.price, 0).toFixed(2));
    paypal.Buttons({
      style: {shape:'rect', color:'blue', label:'pay', height:36},
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: {
              value: String(total)
            },
            description: 'Compra na Minha Loja'
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert('Pagamento concluído por ' + details.payer.name.given_name + '! Obrigado pela compra.');
          state.cart = {}; renderCart();
        });
      },
      onError: function(err){
        console.error(err); alert('Ocorreu um erro no pagamento.');
      }
    }).render('#paypal-button');
  }

  renderProducts();
  renderCart();
</script>
</body>
</html>
